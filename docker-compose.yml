services:
  postgres:
    image: 'postgres:16'
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=test
    ports:
      - 54321:5432
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    container_name: 'api-service-boilerplate'
    ports:
      - 3000:3000
    env_file:
      - ./.env
    # Overrides .env: inside the compose network the DB is the `postgres` service on its internal port.
    environment:
      - NODE_ENV=production
      - PGHOST=postgres
      - PGPORT=5432
