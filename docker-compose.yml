services:
  postgres:
    image: 'postgres:16'
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=test
    ports:
      - 54321:5432
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    container_name: 'api-service-boilerplate'
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=development
      - PGHOST=postgres
      - PGROHOST=postgres
      - PGPORT=5432
      - PGROPORT=5432
    env_file:
      - ./.env
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/dist
      - /app/docs
